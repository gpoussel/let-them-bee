name: Deploy to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: itch
  cancel-in-progress: true

env:
  ITCH_USER: gpoussel
  ITCH_GAME: let-them-bee
  ITCH_CHANNEL: html5

jobs:
  butler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:itch

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          VERSION="$(node -p "require('./package.json').version")+${GITHUB_RUN_NUMBER}"
          ./butler push dist "$ITCH_USER/$ITCH_GAME:$ITCH_CHANNEL" --userversion "$VERSION"
