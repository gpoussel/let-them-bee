name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format (prettier)
        run: npm run format:check
      - name: Lint (eslint)
        run: npm run lint -- --max-warnings=0
      - name: Types (tsc)
        run: npm run typecheck
      - name: Build
        run: npx vite build
